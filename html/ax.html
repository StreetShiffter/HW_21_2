<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

<style>
.full-height {
  height: 100%; <!--  устанавливает высоту элемента в 100 %, чтобы он растягивался на всю высоту родительского элемента -->
}
</style>
  </head>

<body>
<div class="container-fluid">
      <div class="row h-100 vh-100"> <!-- vh-100 = высота экрана, h-100 = растяжение -->
        
        <!-- Левая колонка (2 из 12) -->
        <div class="col-2 p-0 full-height">
          <div class="bg-primary text-white d-flex align-items-start justify-content-start h-100 p-3">
            <h3 class="mb-5">Content here</h3>
          </div>
        </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
  </body>
</html>

<!--container-fluid - обертка для "row" что бы корректно отображалось(занимает весь экран\блок и имеет не большие отступы)
    container- автоматически определяет ширину контента и определяет его по центру(оба метода можно редактировать)


    bg-primary - цвет блока(синий)
    text-white - белый текст
    d-flex - контейнер дисплей(Позволяет выравнивать содержимое внутри блока)

    align-items-start - выравнивает элементы по вертикали вверху
    justify-content-center - выравнивает элементы по горизонтали по центру
	-end-Cправа
	-baseline-Выравнивание разных текстов по линии
	-stretch- По всей высоте
	

    h-100 - устанавливает высоту элемента равной 100% от высоты родительского элемента
    vh-100 -  устанавливает высоту элемента равной 100 % высоты окна браузера
    p-3 - добавляет внутренний отступ 0,75rem = 12px со всех сторон
    col-1(12) - сетка столбцов





 -->
